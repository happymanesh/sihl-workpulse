name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workpulse
          POSTGRES_PASSWORD: workpulse_ci_password
          POSTGRES_DB: workpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://workpulse:workpulse_ci_password@localhost:5432/workpulse_test?schema=public"
      # Stand-in for Synapse's own directory. In every real environment this
      # points at Synapse through a SELECT-only role; here it is a throwaway
      # database loaded from packages/db/ci/synapse-directory-fixture.sql so the
      # federated identity path is exercised rather than skipped.
      SYNAPSE_DATABASE_URL: "postgresql://workpulse:workpulse_ci_password@localhost:5432/synapse_test?schema=public"
      # Repository secret, not a literal. CI-only and unrelated to the real
      # value, which is shared with Synapse and lives nowhere in this repo.
      # SynapseSessionService throws at construction without it, so the app
      # cannot boot for an e2e test at all - hence the guard step below.
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
      FRAPPE_SYNC_MODE: mock

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Check required secrets
        # Without this the failure surfaces much later as an opaque Nest boot
        # error inside the e2e run. A fork, or a clone that has not had the
        # secret set, should be told plainly and immediately.
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "::error::SESSION_SECRET is not set for this repository."
            echo "Set it with: gh secret set SESSION_SECRET"
            echo "Any throwaway value works - CI never talks to the real Synapse."
            exit 1
          fi
          echo "SESSION_SECRET is present (${#SESSION_SECRET} characters)"

      - name: Install dependencies
        run: npm ci

      - name: Build @workpulse/db
        # Generates the Prisma client AND compiles packages/db to dist/.
        # `main`/`types` point at dist/, which is gitignored, so without this
        # every workspace that imports @workpulse/db fails to typecheck. This
        # passed locally only because dist/ already existed on the machine.
        run: npm run build:db

      - name: Apply migrations
        # Was `continue-on-error: true` with a note about there being no
        # migrations yet. There are ten, and the tolerance was hiding a real
        # failure: the target-database guard rejected CI's workpulse_test.
        # A migration that cannot apply is a broken build, so this fails now.
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches a guide claiming a permission the code does not grant. The
      # manager guide told managers to create desk cards for three days while
      # the API refused them, and only a direct question found it.
      - name: Documents agree with the permission rules
        run: npm run docs:check

      - name: Unit tests (apps/api)
        run: npm run test -w apps/api

      - name: Create the Synapse directory stand-in
        run: |
          psql "postgresql://workpulse:workpulse_ci_password@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE synapse_test'
          # ?schema= is a Prisma parameter. libpq rejects it as an unknown URI
          # query parameter, so strip it before handing the URL to psql.
          psql "${SYNAPSE_DATABASE_URL%%\?*}" \
            -v ON_ERROR_STOP=1 -f packages/db/ci/synapse-directory-fixture.sql

      - name: Seed reference data
        # Task types and the Synapse role map come from the seed; Employees and
        # Departments do not - they are a read-cache that only the Frappe HR
        # sync writes, so CI populates them the same way, in mock mode. The e2e
        # suites need both.
        run: |
          npm run db:seed
          npm run sync:frappe-hr -w apps/api

      - name: End-to-end tests (apps/api)
        # These are the tests that prove the rules rather than the arithmetic:
        # confidential work stays hidden from SYSTEM_ADMIN, a flag never counts
        # against anyone, an exit cannot complete with a vacant desk card, and
        # an unmapped Synapse role is refused outright.
        run: npm run test:e2e -w apps/api

      - name: Build
        run: npm run build

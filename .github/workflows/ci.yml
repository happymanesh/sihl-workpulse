name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workpulse
          POSTGRES_PASSWORD: workpulse_ci_password
          POSTGRES_DB: workpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://workpulse:workpulse_ci_password@localhost:5432/workpulse_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy -w packages/db
        # No-op with a clean schema until the first real migration exists
        # (Phase 0 ships the schema; `prisma migrate dev` creates the first
        # migration locally - see docs/phase-0-setup.md). Keeping this step
        # in CI now means Phase 1's first migration is checked automatically
        # rather than the pipeline needing a rewrite later.
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests (apps/api)
        run: npm run test -w apps/api

      - name: Build
        run: npm run build
